{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }} | Secure Vote System{% endblock %}

{% block content %}
<section class="page-section">
    <div class="card card--form">
        <div class="error-page">
            <div class="error-code">{{ code }}</div>
            <h2>{{ title }}</h2>
            <p class="muted">{{ message }}</p>
            <p class="muted">{{ suggestion }}</p>
            <div class="hero-actions">
                <a class="btn btn-primary" href="{{ url_for('home') }}">Return to home</a>
                <a class="btn btn-secondary" href="{{ url_for('contact') }}">Contact support</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
